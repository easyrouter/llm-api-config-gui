name: API configuration problem / API 配置问题
description: Report a reproducible setup or connection problem without sharing secrets.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never include real API keys, full configurations, import URIs, or unredacted logs. 请先查阅 README 中的故障排查。"
  - type: input
    id: environment
    attributes:
      label: OS and app version / 系统与应用版本
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client / 客户端
      options:
        - Codex
        - Claude Code
        - CC Switch
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result / 复现步骤与结果
      description: Include quick or full setup mode and redacted error codes.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私检查
      options:
        - label: I removed credentials and personal data / 已移除密钥和个人信息
          required: true
